<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-labelledby="title desc">
  <title id="title">How Keryx works</title>
  <desc id="desc">Your repository holds a .metaproject directory with the wiki, code graph, memory, rules and skills, and flows. Your coding agents and the keryx shell read from it, and your team reviews it in the same pull requests as the code.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b4fc4"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #24223a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h { font-size: 16px; font-weight: 600; }
    .s { font-size: 13px; fill: #4a4766; }
    .note { font-size: 13px; fill: #4a4766; font-style: italic; }
  </style>

  <rect x="0" y="0" width="880" height="300" rx="14" fill="#f7f6fd" stroke="#d9d5f2"/>

  <!-- Repository frame -->
  <rect x="20" y="20" width="540" height="240" rx="10" fill="#ffffff" stroke="#c9c4e8" stroke-dasharray="6 4"/>
  <text x="38" y="46" class="h">Your repository</text>

  <!-- Code -->
  <rect x="38" y="66" width="170" height="168" rx="8" fill="#eef0f5" stroke="#c3c8d6"/>
  <text x="54" y="94" class="h">Code</text>
  <text x="54" y="120" class="s">source files</text>
  <text x="54" y="142" class="s">tests</text>
  <text x="54" y="164" class="s">git history</text>

  <!-- .metaproject -->
  <rect x="268" y="66" width="272" height="168" rx="8" fill="#ece9fc" stroke="#7c6fd6" stroke-width="1.5"/>
  <text x="284" y="94" class="h mono">.metaproject/</text>
  <text x="284" y="120" class="s">wiki and decisions</text>
  <text x="284" y="142" class="s">code graph</text>
  <text x="284" y="164" class="s">memory, rules and skills</text>
  <text x="284" y="186" class="s">flows with frozen criteria</text>
  <text x="284" y="208" class="s">reviews, health, tests</text>

  <line x1="210" y1="150" x2="264" y2="150" stroke="#5b4fc4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="214" y="140" class="s">keryx</text>

  <!-- Consumers -->
  <rect x="620" y="56" width="240" height="72" rx="8" fill="#ffffff" stroke="#7c6fd6" stroke-width="1.5"/>
  <text x="638" y="84" class="h">Your coding agents</text>
  <text x="638" y="108" class="s">read the same context</text>

  <rect x="620" y="152" width="240" height="72" rx="8" fill="#ffffff" stroke="#7c6fd6" stroke-width="1.5"/>
  <text x="638" y="180" class="h mono">keryx shell</text>
  <text x="638" y="204" class="s">agent with policy and sandbox</text>

  <path d="M542 130 C 580 110, 590 95, 616 92" fill="none" stroke="#5b4fc4" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M542 170 C 580 190, 590 188, 616 188" fill="none" stroke="#5b4fc4" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="440" y="285" class="note" text-anchor="middle">Committed with your code and reviewed in the same pull requests.</text>
</svg>
