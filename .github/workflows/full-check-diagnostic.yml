name: Temporary Linux proxy refusal diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Compare isolated and command-suite behavior
        shell: bash
        run: |
          set +e
          bun --version
          bun --no-env-file scripts/diagnose-proxy-env.ts
          probe=$?
          bun test src/commands/trigger-agent-task.test.ts -t "network allowlist whose proxy cannot bind"
          focused=$?
          env -u TMPDIR -u TMP -u TEMP -u XDG_RUNTIME_DIR bun --no-env-file scripts/diagnose-proxy-env.ts
          unset_probe=$?
          env -u TMPDIR -u TMP -u TEMP -u XDG_RUNTIME_DIR bun test src/commands/trigger-agent-task.test.ts -t "network allowlist whose proxy cannot bind"
          unset_test=$?
          bun test src/commands -t "network allowlist whose proxy cannot bind"
          commands=$?
          printf 'probe=%s focused=%s unset_probe=%s unset_test=%s commands=%s\n' "$probe" "$focused" "$unset_probe" "$unset_test" "$commands"
          if (( probe || focused || unset_probe || unset_test || commands )); then exit 1; fi
