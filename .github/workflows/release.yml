name: Release

# A tag is the only trigger. Pushing `v0.2.0` publishes `0.2.0`; nothing else
# does. `workflow_dispatch` is deliberately absent — a release that can be fired
# by hand from an arbitrary ref is a release whose provenance nobody can read
# off the tag afterwards.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance attestation

jobs:
  release:
    name: verify, publish, announce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog extraction reads history

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm (not bun) publishes, because provenance attestation is an npm CLI
      # feature. Node is here for that, not to run the project.
      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. The Node 22
      # line ships npm 10.x, so the CLI is upgraded explicitly — without this the
      # publish falls back to looking for a token and fails on the 2FA prompt
      # that a CI runner cannot answer.
      # `22` resolves to the latest 22.x, NOT a pin. Pinning to 22.14.0 — the
      # minimum the trusted-publishing docs name — broke the upgrade below,
      # because `npm@latest` has since moved to 12.x and requires
      # `^22.22.2 || ^24.15.0 || >=26.0.0`. Reading a floor from documentation
      # and then asking for `latest` puts two moving parts in the same step.
      - name: Set up Node for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # `npm@11`, not `npm@latest`. The comment above already names the lesson —
      # "reading a floor from documentation and then asking for `latest` puts two
      # moving parts in the same step" — and then the step asked for `latest`
      # anyway. It came due on 0.2.71: `npm@latest` resolved to 12.0.2 and the
      # publish died at `CA_CREATE_SIGNING_CERTIFICATE_ERROR - (403) Forbidden`,
      # after every test and the whole build had passed. 0.2.70 had published
      # cleanly the day before on the 11.x line.
      #
      # So the major is pinned to the one trusted publishing is known to work on
      # here, and the floor assertion below still runs — a pin that drifts under
      # the floor must fail loudly rather than fall through to the token path.
      - name: Upgrade npm to a trusted-publishing capable version
        run: |
          set -euo pipefail
          npm install -g npm@11
          INSTALLED="$(npm --version)"
          echo "npm ${INSTALLED}"
          # Assert the floor rather than assume the upgrade reached it. Without
          # this, a too-old npm would fall through to the token path silently —
          # which is exactly what has to stop happening once the token is gone.
          MAJOR="${INSTALLED%%.*}"
          if [ "$MAJOR" -lt 11 ]; then
            echo "::error::npm ${INSTALLED} is below the 11.5.1 trusted-publishing floor"
            exit 1
          fi

      - name: Install dependencies
        run: bun install

      # The tag and the manifest are two independent statements of one fact.
      # When they disagree, the published artifact carries a version nobody
      # intended — so disagreement is a hard stop, before anything is built.
      - name: Refuse a tag that disagrees with package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag:      $TAG_VERSION"
          echo "manifest: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}."
            exit 1
          fi

      # Any job that runs `bun run check` needs ripgrep, because one test spawns
      # the real binary to prove ripgrep emits `file:line:col` for a single
      # explicit path. That was added to `ci.yml` and not here, so the first
      # tagged release failed on a missing executable — the gate did its job and
      # published nothing, but the omission is the same shape as the defects
      # this repository keeps recording: a requirement satisfied in one place
      # and not written down as belonging to the suite.
      # Non-fatal `update` for the reason given in `ci.yml`: a third-party
      # repository this project never uses must not be able to fail a release.
      - name: Install ripgrep
        timeout-minutes: 12
        run: |
          set -euo pipefail
          sudo timeout --kill-after=30s 240s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 update || echo "apt-get update reported errors or timed out; the install below is the gate"
          sudo timeout --kill-after=30s 300s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=60 install -y ripgrep

      - name: Confirm ripgrep is present
        run: rg --version

      # The same gates CI runs. A tag must not be able to ship something a pull
      # request could not.
      - name: Typecheck and tests
        run: bun run check

      - name: Documentation links
        run: bun run check:doc-links

      - name: Security red-team FN-rate gate
        run: bun ./src/cli.ts security eval --corpus all

      - name: Metaproject Standard
        run: bun ./src/cli.ts standard validate

      # Prove the artifact runs before it is published, not after. `prepare`
      # builds `dist/`; this asserts the built binary answers.
      - name: Build and smoke-test the packed artifact
        run: |
          set -euo pipefail
          # `--pack-destination` does not create the directory, and the first
          # attempt at this step assumed it did: `npm pack` wrote nothing there,
          # the tarball lookup produced nothing, and the failure surfaced two
          # commands later as an ENOENT on a path that had never existed. Make
          # the directory, then assert the artifact before using it, so a broken
          # pack fails HERE with a legible reason.
          mkdir -p ./.release
          npm pack --pack-destination ./.release
          ls -l ./.release
          TARBALL="$(find ./.release -maxdepth 1 -name '*.tgz' -print -quit)"
          if [ -z "$TARBALL" ]; then
            echo "::error::npm pack produced no tarball in ./.release"
            exit 1
          fi
          echo "packed: $TARBALL"
          npm install -g --prefix ./.release/prefix "$TARBALL"
          ./.release/prefix/bin/keryx --help > /dev/null
          echo "the installed binary runs"

          # CORE-ONLY, the install AFC-19 actually names: "установка/работа core
          # не тянут model runtime/credentials". The smoke above installs WITH
          # optionalDependencies, one of which (`@opentui/core`) is a terminal-UI
          # renderer — a client runtime — so it could never have shown that a
          # core-only install works. `--omit=optional` is the install a consumer
          # who wants the core gets, and until now it was exercised nowhere.
          #
          # No API key is set in this step's environment, and none is inherited:
          # the assertion is "runs with no client and no keys", so a credential
          # reaching it would make the result unreadable.
          npm install -g --omit=optional --prefix ./.release/prefix-core "$TARBALL"
          env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY \
            ./.release/prefix-core/bin/keryx --help > /dev/null
          # …and one real core command, not just `--help`: a binary that prints
          # usage and dies on the first operation would pass a help-only check.
          env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY \
            ./.release/prefix-core/bin/keryx status > /dev/null
          echo "the core-only install runs with no client and no keys"

          # The package's LIBRARY door, exercised the way a consumer reaches it:
          # resolve `exports["."]` from outside the package and import it. This
          # is the half `--help` cannot reach — the CLI has a `bin`, so it would
          # keep working with a broken or absent `exports` map, which is exactly
          # the state this package shipped in until flow 239.
          #
          # `bun`, not `node`, and that is a real property of this package rather
          # than a convenience: `dist/*.js` are `--target bun` bundles that
          # import `bun:` builtins, so Node's ESM loader rejects them with
          # ERR_UNSUPPORTED_ESM_URL_SCHEME (measured, not assumed). `bin/keryx`
          # has always needed bun for the same reason, and `engines` says so.
          mkdir -p ./.release/importer
          cd ./.release/importer
          npm init -y > /dev/null
          npm install --omit=optional "../../$TARBALL" > /dev/null
          env -u ANTHROPIC_API_KEY -u OPENAI_API_KEY -u GEMINI_API_KEY bun -e "
            const core = await import('@mrciphersmith/keryx');
            const doors = Object.keys(core).sort();
            console.log('core entry exports: ' + doors.join(', '));
            if (doors.length === 0) {
              throw new Error('the core entry resolved but exported nothing');
            }
            // A private core path must NOT resolve — and the file it names IS in
            // the tarball, so a failure here is the exports map doing its job
            // rather than a missing file.
            try {
              await import('@mrciphersmith/keryx/src/gdgraph/query.ts');
              throw new Error('a private core path is still importable');
            } catch (error) {
              if (String(error).includes('still importable')) { throw error; }
              console.log('private core paths are not importable');
            }
          "
          cd ../..

      # Standalone binaries, cross-compiled on this SAME runner — no OS matrix.
      # Bun's `--compile --target=<val>` cross-compiles macOS/Linux binaries from
      # one machine (confirmed against `bun build --help` and current upstream
      # docs, not assumed), so adding four runners here would work against this
      # file's own stated minimal-CI-surface philosophy for no benefit.
      #
      # Only `bun-linux-x64` can actually execute on this `ubuntu-latest`/x64
      # runner — the other three are cross-compiled for a different OS/arch and
      # structurally cannot run here. For those, `--help` is not attempted; `file`
      # reporting the expected platform/arch is the strongest check this runner
      # can honestly make. Do not read more into a passing `file` check than that.
      #
      # `set -euo pipefail` matters here specifically: without it, one target's
      # `bun build` failure inside the loop would not stop the loop, and a broken
      # binary could still reach `gh release create` below.
      #
      # `bun install --os='*' --cpu='*'` first: a plain `bun install` (already run
      # above) only fetches the CURRENT runner's platform variant of packages like
      # `@opentui/core`'s per-platform native binaries (`@opentui/core-darwin-x64`,
      # `@opentui/core-linux-arm64`, …) — `os`/`cpu` fields on an optionalDependency
      # filter the file-system install to the matching platform regardless of what
      # is pinned in the lockfile. Without this, cross-compiling for any target
      # other than the runner's own (bun-linux-x64 on ubuntu-latest) fails with
      # `Could not resolve: "@opentui/core-<other-platform>"` — confirmed by
      # reproducing the failure locally before finding this fix, not assumed.
      - name: Build and smoke-test the standalone binaries
        run: |
          set -euo pipefail
          bun install --os='*' --cpu='*'
          mkdir -p ./.release
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            asset="./.release/keryx-$target"
            echo "building $target"
            # R1-01 (flow 319, review round 1, blocker): a compiled binary
            # has no shebang for `--no-env-file`/`--config=/dev/null` to sit
            # on, so the equivalent compile-time flags go here instead —
            # otherwise the standalone binary would auto-load a cwd `.env`/
            # `bunfig.toml` same as an unpatched `bun <script>` would. See
            # `src/lib/safe-exec.ts` and `src/cli.ts`'s shebang comment.
            bun build ./src/cli.ts --compile --target=$target \
              --no-compile-autoload-dotenv --no-compile-autoload-bunfig \
              --outfile "$asset"

            if [ ! -s "$asset" ]; then
              echo "::error::$asset was not produced or is empty"
              exit 1
            fi

            echo "file: $(file "$asset")"

            if [ "$target" = "bun-linux-x64" ]; then
              # The one target that matches this runner's own OS/arch — actually
              # executable here, so it gets the same rigor as the npm smoke test.
              "$asset" --help > /dev/null
              echo "$target: the binary runs"
            else
              # Cross-compiled for a different OS/arch than this runner. It
              # cannot be executed here — running it would either fail to exec
              # at all or silently invoke the wrong architecture under
              # emulation. `file` reporting the expected target platform/arch is
              # a real, if weaker, integrity check; it is not a substitute for
              # "it ran" and is not reported as one.
              # A default arm is required, not decorative: without one, a
              # future target added to the for-loop above with no matching
              # case arm here would silently leave `$expect` holding the
              # PREVIOUS iteration's value instead of failing, and the
              # `grep -q "$expect"` integrity check below could spuriously
              # pass for a target it was never meant to check.
              case "$target" in
                bun-darwin-*) expect="Mach-O" ;;
                bun-linux-*)  expect="ELF" ;;
                *)
                  echo "::error::no expected file(1) signature configured for target $target"
                  exit 1
                  ;;
              esac
              if ! file "$asset" | grep -q "$expect"; then
                echo "::error::$asset does not look like a $expect binary for $target"
                exit 1
              fi
              echo "$target: not executable on this runner (cross-compiled) — file(1) confirms $expect format"
            fi
          done

      # Extract this version's section from CHANGELOG.md for the release body.
      # An empty extraction fails the job: a release whose notes are blank is
      # worse than no release, because it looks intentional.
      - name: Extract the changelog section for this version
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { capture = 1; print; next }
            capture && /^## \[/    { exit }
            capture                { print }
          ' CHANGELOG.md > ./.release/notes.md
          if [ ! -s ./.release/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for [${VERSION}]."
            exit 1
          fi
          cat ./.release/notes.md

      # No token. Authentication is the OIDC identity of this workflow, matched
      # against the trusted publisher registered on the package
      # (`MrCipherSmith/keryx`, `release.yml`). That registration is why the
      # `NODE_AUTH_TOKEN` env block that used to sit here is gone, and why the
      # `NPM_TOKEN` secret was deleted rather than left in place unused: a
      # credential that nothing reads is still a credential that can be read.
      #
      # The bootstrap ordering is worth recording, because it is not obvious and
      # cost four failed attempts to learn. A trusted publisher is configured at
      # `npmjs.com → Packages → <package> → Settings → Trusted publishing`, so
      # **the package must already exist** — the very first publish of a new
      # package cannot use it. That first publish went out under a classic
      # Automation token, which is the only token type that bypasses the 2FA
      # prompt a runner cannot answer; a granular token obeys the account 2FA
      # setting and fails with `EOTP`.
      #
      # `--provenance` needs `id-token: write`, which is already granted above
      # for exactly this reason.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The 4 standalone binaries attach here as additional positional file
          # arguments alongside the .tgz — one release, one call, not a second
          # release step for the binaries.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file ./.release/notes.md \
            ./.release/*.tgz \
            ./.release/keryx-bun-*

  # The Team Hub is versioned with the CLI: the tag that publishes `0.2.0` of the
  # CLI also publishes `0.2.0` of the Hub, and no other trigger does. Same rule as
  # the top of this file, so there is still no `workflow_dispatch`.
  #
  # `needs: release` IS the verification gate. That job runs the whole suite, the
  # standard gates and the packed-artifact smoke before it publishes, and only a
  # successful run reaches the end of it — so a tag that fails verification, or
  # whose npm publish fails, publishes no Hub either: one tag, one outcome. It also
  # means the GitHub Release this job uploads to already exists. If this job fails
  # on its own, re-run just this job from the Actions page: the upload uses
  # `--clobber`, and the image tags are simply pushed again.
  hub:
    name: Team Hub image and install bundle
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # A job-level block REPLACES the top-level one, so this job has neither
    # `id-token` nor anything else the npm publish needed. `packages: write` pushes
    # to ghcr.io; `contents: write` uploads to the Release. The image attestations
    # (provenance, SBOM) are BuildKit's and are pushed with the image, so they need
    # no further permission.
    permissions:
      contents: write
      packages: write
    steps:
      # Pinned to commits, unlike the first job: this job holds `packages: write`.
      - name: Check out the tag
        # actions/checkout v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Bun
        # oven-sh/setup-bun v2.2.0
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      # `latest` moves only for a release, never for a prerelease (`0.4.0-rc.1`).
      - name: Work out the version and the image tags
        id: v
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/mrciphersmith/keryx-team-hub"
          TAGS="${IMAGE}:${VERSION}"
          case "$VERSION" in
            *-*) echo "prerelease ${VERSION}: not tagging latest" ;;
            *) TAGS="${TAGS}"$'\n'"${IMAGE}:latest" ;;
          esac
          {
            echo "version=${VERSION}"
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Shell scripts parse and lint
        run: |
          set -eu
          # dash is /bin/sh on Debian and Ubuntu, where these scripts run; bash is not a test of that.
          for f in deploy/team-hub/install.sh deploy/team-hub/hubctl deploy/team-hub/release/*.sh; do
            sh -n "$f"
            dash -n "$f"
          done
          shellcheck -s sh deploy/team-hub/install.sh deploy/team-hub/hubctl deploy/team-hub/release/*.sh

      # Source archive, SHA256SUMS and the two Linux executables. The commit time
      # makes the archive's bytes a function of the tag, so a re-run reproduces them.
      - name: Package the Hub (source archive and Linux binaries)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hub" "$RUNNER_TEMP/hub-src"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bun scripts/package-team-hub.ts --out "$RUNNER_TEMP/hub" --linux-x64
          ls -l "$RUNNER_TEMP/hub"

      # The image is built from what the release SHIPS, not from the checkout: if
      # the archive omits a file the image needs, this is where it shows.
      - name: Extract the archive the image is built from
        run: tar -xzf "$RUNNER_TEMP/hub/team-hub-prototype-source.tar.gz" -C "$RUNNER_TEMP/hub-src" --strip-components=1

      - name: Build the install bundle and validate every install mode
        run: |
          set -eu
          sh deploy/team-hub/release/bundle.sh "$RUNNER_TEMP/hub" "${{ steps.v.outputs.version }}"
          sh deploy/team-hub/release/check-modes.sh "$RUNNER_TEMP/hub/team-hub-install.tar.gz"

      - name: Set up QEMU (for the arm64 image)
        # docker/setup-qemu-action v4.4.0
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        # docker/setup-buildx-action v4.4.1
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      # One platform, loaded locally, so it can be run BEFORE anything is pushed.
      - name: Build the amd64 image for the pre-publication checks
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ runner.temp }}/hub-src
          file: ${{ runner.temp }}/hub-src/deploy/team-hub/Dockerfile
          platforms: linux/amd64
          load: true
          provenance: false
          tags: keryx-team-hub:release-check

      - name: Start the image with throwaway tokens and require /healthz 200
        run: sh deploy/team-hub/release/smoke-image.sh keryx-team-hub:release-check

      - name: Install, back up, restore, upgrade and roll back with the real scripts
        run: sh deploy/team-hub/release/e2e.sh keryx-team-hub:release-check

      - name: Log in to ghcr.io
        # docker/login-action v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # BuildKit's own attestations: a SLSA provenance statement (mode=max records
      # the build arguments and the source) and an SPDX SBOM, both attached to the
      # image index. They are what `docker buildx imagetools inspect` shows.
      - name: Build and push the multi-arch image
        id: push
        # docker/build-push-action v7.4.0
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ runner.temp }}/hub-src
          file: ${{ runner.temp }}/hub-src/deploy/team-hub/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.title=Keryx Team Hub
            org.opencontainers.image.description=The Keryx Team Hub server with its web app, released with the Keryx CLI
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      # A package that a workflow creates for the first time can come out private,
      # and an install on someone else's server pulls it anonymously. So pull the
      # digest with NO credentials (an empty Docker config) and run it once more.
      # If this fails on the very first release, make the package public once:
      # GitHub -> Packages -> keryx-team-hub -> Package settings -> Change visibility.
      - name: Prove the published digest pulls anonymously and starts
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          if ! docker pull "$REF"; then
            echo "::error::$REF cannot be pulled without credentials. Make the keryx-team-hub package public (Package settings -> Change visibility) and re-run this job."
            exit 1
          fi
          sh deploy/team-hub/release/smoke-image.sh "$REF"

      # The digest, not a tag, is what an install pins: a tag can be moved after the
      # fact, a digest names these bytes.
      - name: Write the image digest and the checksums
        env:
          REF: ${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hub"
          printf '%s\n' "$REF" > team-hub-image.txt
          # package-team-hub.ts already listed the archive and the binaries; add the rest.
          for f in team-hub-install.tar.gz team-hub-install.sh team-hub-image.txt; do
            sha256sum "$f" >> SHA256SUMS
          done
          sort -k 2 SHA256SUMS -o SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      # `--clobber` replaces an asset that is already on the Release. That is what lets a failed job
      # be re-run to completion; the price is that a re-run silently replaces files that may already
      # have been downloaded. SHA256SUMS is replaced with them, so the set stays consistent, and
      # the image reference inside is a digest, which does not change under anyone. Signing the
      # assets, so that a replaced file is detectable, is future work (docs/requirements/
      # team-hub-distribution/specification.md, out of scope).
      - name: Upload the Hub assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hub"
          gh release upload "$GITHUB_REF_NAME" --clobber \
            team-hub-prototype-source.tar.gz \
            team-hub-server-linux-x64 \
            team-hub-client-linux-x64 \
            team-hub-install.tar.gz \
            team-hub-install.sh \
            team-hub-image.txt \
            SHA256SUMS
