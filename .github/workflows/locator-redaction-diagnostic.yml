name: Locator redaction diagnostic (no publish)
on:
  push:
    branches: [diagnostic/917-locator-redaction]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.3.14", "1.4.2"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e7e8586f74feddbd5466bf32df8b08c1b151b390
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install runtime search dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
          command -v rg
      - name: Install and record context
        run: |
          mkdir -p "$RUNNER_TEMP/locator-diagnostic"
          { git rev-parse HEAD; bun --version; node --version; uname -a; } | tee "$RUNNER_TEMP/locator-diagnostic/context.log"
          bun install --frozen-lockfile
      - name: Observe locator findings without changing detector
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('src/security/redact.ts')
          s = p.read_text()
          anchor = '  if (matches.length === 0) {\n'
          assert s.count(anchor) == 1
          s = 'import { writeSync as locatorDiagnosticWriteSync } from "node:fs";\n' + s
          observer = """  if (text.includes('dig-')) {
            locatorDiagnosticWriteSync(2, 'LOCATOR_DIAGNOSTIC ' + JSON.stringify({
              length: text.length,
              locatorOffset: text.indexOf('dig-'),
              matches: matches.map(m => ({start: m.start, end: m.end, mask: m.mask})),
            }) + '\\n');
          }
          """
          p.write_text(s.replace(anchor, observer + anchor))
          Path(__import__('os').environ['RUNNER_TEMP'] + '/locator-diagnostic/instrumentation.txt').write_text(observer)
          PYCODE
      - name: Probe exact failed CI locator on original scrubber
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          bun -e '
            import {scrubGrantedOutput} from "./src/commands/trigger-agent-task.ts";
            const text = "Digest stopped: gh failed for every source. Report: /tmp/locator-diagnostic/dig-20261002T120000-3991d42d.md";
            const output = scrubGrantedOutput(text, {});
            console.log(JSON.stringify({unchanged: output === text, phoneMasked: output.includes("[REDACTED:phone]")}));
          ' 2>&1 | tee "$RUNNER_TEMP/locator-diagnostic/exact-probe.log"
      - name: Exact runtime suite
        if: ${{ !cancelled() && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        shell: bash
        run: |
          set +e
          bun run test:client:runtime 2>&1 | tee "$RUNNER_TEMP/locator-diagnostic/runtime.log"
          statuses=("${PIPESTATUS[@]}")
          printf 'test_exit=%s\nlog_exit=%s\n' "${statuses[0]}" "${statuses[1]}" | tee "$RUNNER_TEMP/locator-diagnostic/result.txt"
          if [ "${statuses[0]}" -ne 0 ]; then exit "${statuses[0]}"; fi
          exit "${statuses[1]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locator-diagnostic-bun-${{ matrix.bun }}-${{ github.run_id }}
          path: ${{ runner.temp }}/locator-diagnostic/
          retention-days: 14
