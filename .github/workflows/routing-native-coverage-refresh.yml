name: Routing native coverage refresh
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regenerate:
    if: github.event.pull_request.head.ref == 'feature/unified-model-routing' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun scripts/verify-native-coverage.ts --write
      - uses: actions/upload-artifact@v4
        with:
          name: routing-native-coverage
          if-no-files-found: error
          path: |
            output/hub-remote-sessions/native-command-coverage.json
            src/session/native-coverage.generated.ts
  hub-chat:
    if: github.event.pull_request.head.ref == 'feature/unified-model-routing' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd apps/hub-web --no-save
      - run: bun run --cwd apps/hub-web typecheck
      - run: bun run --cwd apps/hub-web test tests/remote.case.tsx
      - run: bun scripts/build-hub-web.ts --check
