name: Refresh native coverage artifact

on:
  push:
    branches: [feat/keryx-state-export]
    paths: [.github/workflows/native-coverage-refresh.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Regenerate inventory and embedded descriptor
        shell: bash
        run: |
          set -o pipefail
          bun --no-env-file scripts/verify-native-coverage.ts --write 2>&1 | tee native-coverage-refresh.log
      - name: Save regenerated files and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-coverage-refresh-${{ github.sha }}
          if-no-files-found: error
          path: |
            output/hub-remote-sessions/native-command-coverage.json
            src/session/native-coverage.generated.ts
            native-coverage-refresh.log
