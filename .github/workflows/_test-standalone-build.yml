name: TEMP - test standalone binary build

# Manually-triggered only. Exists ONLY to verify release.yml's new
# standalone-binary build+smoke-test step actually works on a real
# GitHub Actions runner before merging — deleted before this PR merges.
# release.yml itself deliberately has no workflow_dispatch (see its own
# header comment); this file is not release.yml and is not meant to
# survive past this verification.
on:
  workflow_dispatch: {}

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build and smoke-test the standalone binaries
        run: |
          set -euo pipefail
          mkdir -p ./.release
          for target in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            asset="./.release/keryx-$target"
            echo "building $target"
            bun build ./src/cli.ts --compile --target=$target --outfile "$asset"

            if [ ! -s "$asset" ]; then
              echo "::error::$asset was not produced or is empty"
              exit 1
            fi

            echo "file: $(file "$asset")"

            if [ "$target" = "bun-linux-x64" ]; then
              "$asset" --help > /dev/null
              echo "$target: the binary runs"
            else
              case "$target" in
                bun-darwin-*) expect="Mach-O" ;;
                bun-linux-*)  expect="ELF" ;;
              esac
              if ! file "$asset" | grep -q "$expect"; then
                echo "::error::$asset does not look like a $expect binary for $target"
                exit 1
              fi
              echo "$target: not executable on this runner (cross-compiled) — file(1) confirms $expect format"
            fi
          done
          ls -la ./.release
