name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # --- Execution Observability CI Protocol (ci-protocol.md) -----------------
  # Four jobs replace the former single `check`. The point is the baseline gate:
  # a PR's `standard validate` result is only trustworthy once the SAME check has
  # been run independently on `main` and the two statuses classified, so a
  # pre-existing main defect is not misread as a PR regression.

  typecheck-and-tests:
    name: typecheck-and-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ripgrep is a documented requirement of `keryx ctx rg` and of the agent's
      # `search_code` tool, and one test spawns the real binary to prove ripgrep
      # actually emits `file:line:col` for a single explicit file path — the
      # shape `parseRgMatches` depends on. That assertion is an oracle about an
      # external tool, so skipping it when the tool is absent would leave the
      # assumption unverified while the job stayed green. Install it instead.
      # `apt-get update` exits non-zero when ANY configured repository fails,
      # including third-party ones this project never uses. The runner image
      # ships Google's Chrome repository; on 2026-09-09 it served a bad index
      # and every job here failed at this step without reaching the code. The
      # condition worth gating on is whether ripgrep installs, so let `update`
      # report and let `install` decide — it exits non-zero on its own if the
      # package cannot be fetched.
      - name: Install ripgrep
        run: |
          sudo apt-get update || echo "apt-get update reported errors; the install below is the gate"
          sudo apt-get install -y ripgrep

      - name: Confirm ripgrep is present
        run: rg --version

      # `check:core`, not `check`. AFC-19 asks for the client to be gated by a
      # SEPARATE matrix ("TUI/readline, streaming/cancel/resume проверяются
      # отдельной матрицей") and for the core gate to be "полностью
      # offline/model-free" (implementation-plan.md, "Выделение Shell"). One job
      # running everything cannot report those two things separately, so this
      # job now runs lint + both typechecks + `test:core`, and the
      # `client-matrix` job below runs the client zone.
      #
      # The two together still run every test file in `src/`: that is asserted
      # statically by `src/core-package.test.ts` ("the core gate and the client
      # matrix between them run every test in src/"), which fails if a test file
      # is matched by neither — the silent-coverage-loss this split would
      # otherwise be free to introduce. It caught two real gaps the first time
      # it ran. `bun run check` (everything, one command) is unchanged and is
      # still what `release.yml` runs before publishing.
      - name: Typecheck and core gate (offline, model-free)
        run: bun run check:core

      # `wiki check-links` covers the wiki; nothing covered `docs/` or the root
      # Markdown until now — which is how a documentation pass could green-light
      # a set of pages pointing at each other incorrectly. It found 39 broken
      # links the first time it ran. A broken link fails the pull request.
      - name: Documentation links
        run: bun run check:doc-links

      - name: Security red-team FN-rate gate (Block E / E6)
        run: bun ./src/cli.ts security eval --corpus all

  client-matrix:
    # AFC-19's "отдельная матрица": the client surfaces the criterion names —
    # terminal interface and line editing, streaming, cancellation, resumption —
    # gated SEPARATELY from core, one leg each, so each behaviour reports its own
    # status instead of disappearing into a single green tick. Before this job
    # they were tested (every one of them, offline, with no credentials) but only
    # ever reported as part of one `bun run check`.
    #
    # Every leg is offline and key-free, like the core gate: no test in these
    # paths is gated on an API key, and the only skips are the repository's
    # opt-in real-subprocess and PTY flags, which are not set here. Those live
    # legs have their own jobs below (`macOS real-host legs`, `linux-sandbox`).
    #
    # `runtime` is deliberately a SUPERSET of the three behaviour legs' harness
    # paths. The behaviour legs exist to report those behaviours; `runtime`
    # exists so the client zone as a whole cannot develop a gap when a new
    # `src/harness/` subdirectory appears. The overlap costs parallel CI time,
    # not honesty, and `src/core-package.test.ts` asserts the union of the core
    # gate and these legs covers every test file in `src/`.
    name: client matrix (${{ matrix.leg }})
    runs-on: ubuntu-latest
    strategy:
      # One behaviour's failure must not hide the others' status.
      fail-fast: false
      matrix:
        leg: [terminal, streaming, cancel-resume, runtime]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # `src/harness/search/` shells out to the real ripgrep binary, for the same
      # reason `typecheck-and-tests` installs it: an assertion about an external
      # tool's output shape is not worth having if the tool can be absent and the
      # job still go green.
      # Non-fatal `update` for the reason given at the `typecheck-and-tests`
      # copy of this step: a broken third-party repository must not be able to
      # fail a job that only needs ripgrep.
      - name: Install ripgrep
        run: |
          sudo apt-get update || echo "apt-get update reported errors; the install below is the gate"
          sudo apt-get install -y ripgrep

      - name: Confirm ripgrep is present
        run: rg --version

      # `bun test` exits non-zero when a filter matches no test file, so a leg
      # whose paths were renamed away fails here rather than passing vacuously.
      - name: Client gate — ${{ matrix.leg }}
        run: bun run test:client:${{ matrix.leg }}

  standard-baseline:
    # Independently measure `main` so `standard-pr` can classify against it.
    name: standard-baseline
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.baseline.outputs.status }}
    steps:
      - name: Check out main (independent baseline)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # A red baseline is DATA (baseline-red), not a job failure: it tells
      # `standard-pr` that a PR failure is diagnostic, not an isolated regression.
      # So capture the status into a job output and never let a non-zero
      # `standard validate` exit fail this job.
      #
      # THREE outcomes, not two (F-240-04, flow 240 T7). `standard validate`
      # exits 1 when the workspace fails validation — and `bun` also exits 1 when
      # it cannot load `./src/cli.ts` at all, when an install left the tree
      # broken, or when the process dies before reaching a verdict. The exit code
      # alone cannot separate those, and this step used to fold every non-zero
      # exit into `status=fail`: a run in which NO validation happened, published
      # as a validation result. `standard baseline` then read it as
      # `baseline-red`, and a red baseline excuses every PR failure — so a main
      # branch that merely stopped booting silently disabled the PR gate. It was
      # reproduced by running this block in a directory without `./src/cli.ts`:
      # `error: Module not found "./src/cli.ts"`, and `status=fail` recorded.
      #
      # `handleValidate` (src/commands/standard.ts) prints one of exactly two
      # verdict lines when, and only when, it reached a verdict. Those two
      # strings are pinned by `src/commands/standard-verdict-markers.test.ts`, so
      # this contract cannot drift out from under CI silently. No verdict line
      # (or a verdict line disagreeing with the exit code) means the command did
      # not run: `unknown`, which is neither a pass nor a red baseline.
      #
      # Both greps below are FIXED STRINGS (`-F`), matching the pass side's
      # discipline exactly (flow 240 T9). The fail side used to be
      # `grep -Eq 'FAIL .*[0-9]+ error\(s\)'` — a regex loose enough that ANY
      # line anywhere in the log containing the word FAIL and, somewhere later,
      # a number followed by `error(s)` would classify as `fail`, whether or not
      # it was the verdict line at all (e.g. a foreign line like
      # `FAIL src/x.test.ts had 3 error(s) reported` at exit 1). `FAIL — ` (with
      # the em dash `handleValidate` actually emits) is the fixed prefix of the
      # real verdict line and nothing else in this command's output can produce
      # it, the same way the pass side's full sentence can't be produced by
      # accident.
      - name: Validate main and publish provenance
        id: baseline
        run: |
          set +e
          bun ./src/cli.ts standard validate > validate.log 2>&1
          code=$?
          set -e
          cat validate.log
          if [ "$code" -eq 0 ] && grep -Fq 'workspace is Metaproject Standard compliant' validate.log; then
            verdict=pass
          elif [ "$code" -ne 0 ] && grep -Fq 'FAIL — ' validate.log; then
            verdict=fail
          else
            verdict=unknown
            echo "::error::standard validate produced no verdict on main (exit ${code}). This is NOT a red baseline: no validation ran, so nothing here excuses a PR failure."
          fi
          echo "baseline verdict: ${verdict}"
          echo "status=${verdict}" >> "$GITHUB_OUTPUT"

  standard-pr:
    name: standard-pr
    runs-on: ubuntu-latest
    needs: standard-baseline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Measure the PR status independently; the classification step below owns
      # this job's verdict, so do not hard-fail here.
      #
      # Same three-outcome classification as `standard-baseline` above, and for
      # the same reason (F-240-04): a `bun` that cannot load the entry point
      # exits 1 exactly like a workspace that fails validation, and folding both
      # into `fail` publishes a non-run as a validation result. Kept verbatim in
      # both jobs on purpose — the two statuses must be measured the same way for
      # the comparison between them to mean anything.
      - name: Validate the PR
        id: pr
        run: |
          set +e
          bun ./src/cli.ts standard validate > validate.log 2>&1
          code=$?
          set -e
          cat validate.log
          if [ "$code" -eq 0 ] && grep -Fq 'workspace is Metaproject Standard compliant' validate.log; then
            verdict=pass
          elif [ "$code" -ne 0 ] && grep -Fq 'FAIL — ' validate.log; then
            verdict=fail
          else
            verdict=unknown
            echo "::error::standard validate produced no verdict on this PR (exit ${code}). A check that did not run has not passed."
          fi
          echo "pr verdict: ${verdict}"
          echo "status=${verdict}" >> "$GITHUB_OUTPUT"

      # Classification-only. CI owns both independently measured statuses and
      # passes them in. `standard baseline` exits non-zero whenever the PR result
      # is not a measured pass, EXCEPT when main was measured and found failing
      # (`baseline-red`) — the one case where a PR failure is genuinely
      # diagnostic. `--pr unknown` and `--baseline unknown --pr fail` both exit 1
      # now (F-240-04); both used to exit 0, which is how a non-running check
      # disabled this gate. The rule lives in `src/standard/baseline.ts`
      # (`BaselineComparison.blocking`) and is covered by
      # `src/standard/baseline.test.ts`, not restated in YAML.
      - name: Classify the PR against the main baseline
        run: |
          bun ./src/cli.ts standard baseline \
            --baseline "${{ needs.standard-baseline.outputs.status }}" \
            --pr "${{ steps.pr.outputs.status }}"

  dependency-audit:
    # F-240-03 (flow 240 T7). This phase reached zero dependency advisories and
    # NOTHING guarded that state: `dependencyAudit` is an OPTIONAL health source
    # (deliberately — see the reasoning on `DEFAULT_HEALTH_CONFIG.sources` in
    # src/health/config.ts: it needs the network, and a gate that fails on a
    # plane teaches people to bypass gates), and no workflow ran an audit on any
    # schedule. So a new advisory could land and every check stay green.
    #
    # This is where the blocking dependency check belongs: one job, on a
    # networked runner, that a human can act on — not on every local `keryx
    # health` invocation.
    #
    # It drives the PRODUCTION adapter (`src/health/sources/dependency-audit.ts`)
    # rather than calling `bun audit` by hand, so a defect in command selection,
    # JSON decoding or severity mapping fails HERE instead of hiding behind a
    # hand-rolled duplicate of the thing under test. (`keryx health run --source
    # dependencyAudit` is deliberately not used: a source filter marks the
    # omitted REQUIRED sources broken and the run exits incomplete by design —
    # `health-truthful-gate.test.ts`, "a source filter ... cannot report a clean
    # gate" — so the gate's verdict there is about the filter, not the audit.)
    #
    # NON-VACUITY IS THE POINT, and it is asserted in the only place that can
    # carry it: `validate()` returns `valid: true` only for a payload that
    # actually IS vulnerability data. `npm audit` with no lockfile exits 1 with
    # ~240 bytes of `{"error":{"code":"ENOLOCK"}}` — an object whose severity
    # totals are all zero, indistinguishable from a clean project unless someone
    # checks. That is F-240-02's defect exactly, and this job refuses to report
    # "0 advisories" until the payload has been recognised.
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Audit dependencies through the production health source
        run: |
          cat > audit-check.ts <<'TS'
          import { dependencyAuditAdapter as adapter } from "./src/health/sources/dependency-audit";
          import type { HealthContext } from "./src/health/types";

          const ctx = { cwd: process.cwd() } as HealthContext;
          const raw = await adapter.run(ctx);
          const validation = adapter.validate?.(raw) ?? { valid: false, error: "adapter has no validate()" };
          console.log(`command: ${raw.command}`);
          console.log(`exit: ${raw.exitCode}`);
          console.log(`payload recognised: ${validation.valid}${validation.valid ? "" : ` (${validation.error})`}`);

          // The audit did not run, or ran and produced something that is not a
          // vulnerability report. Either way it has found nothing BECAUSE IT
          // COULD NOT LOOK, and reporting that as clean is the defect.
          if (!validation.valid) {
            console.log(raw.content.slice(0, 2000));
            console.error("::error::dependency audit produced no recognisable result; this is NOT a clean audit");
            process.exit(1);
          }

          // Only now is a count meaningful.
          const findings = adapter.parse(raw, ctx);
          for (const finding of findings) console.log(`::error::${finding.message}`);
          if (findings.length > 0) {
            console.error(`::error::${findings.length} dependency advisory/advisories`);
            process.exit(1);
          }
          console.log("dependency-audit: RAN, 0 advisories");
          TS
          bun audit-check.ts

  metrics-contract:
    # Schema, provenance, latest-pointer, worktree-safe hook, and lightweight-mode
    # tests for the execution-observability runtime.
    name: metrics-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Observability contract tests
        run: bun test src/metrics/service.test.ts src/lib/git-hooks.test.ts src/lib/templates.test.ts

  tui-pty-launch:
    # O-6. Every other check that touches the TUI runs without a controlling
    # terminal, so `createCliRenderer` declines and the shell takes the readline
    # path — the renderer is proven only headlessly, and NOTHING proved the
    # shipped `keryx shell` launches and draws on a real terminal. Flow 065 is
    # the precedent: a stdin-handoff bug that leaked terminal query responses
    # ONLY on a real TTY reverted the TUI out of the default, and took flows 066
    # and 067 to fix. This job is what would have caught it.
    #
    # macOS only, deliberately. The suite allocates its pty with BSD `script`,
    # whose command syntax differs from util-linux's; the Linux form is NOT
    # exercised, so it is not shipped. Adding a Linux leg means writing and
    # verifying that branch first — and narrowing O-6 further in
    # docs/requirements/keryx-opentui-shell/specification.md.
    #
    # Not folded into `check` (ubuntu, where it would only ever skip) and not
    # into the default `bun test` (it spawns real processes, so it follows the
    # repository's KERYX_ALLOW_REAL_SUBPROCESS convention). ~40s, one runner.
    #
    # This job also carries the macOS-only OS-sandbox coverage (see the step
    # below). Both legs need the same scarce thing — a macOS runner with
    # KERYX_ALLOW_REAL_SUBPROCESS=1 — and the free tier's macOS concurrency
    # ceiling is what actually rations CI here, so they share one runner rather
    # than queueing two. The sandbox step runs FIRST, deliberately: the pty leg
    # is gated on `/usr/bin/script`, and if the runner image ever drops it, that
    # failure must not take the sandbox evidence down with it.
    name: macOS real-host legs — OS sandbox + TUI pty launch
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # TEST-01. The macOS seatbelt path, the allowlist proxy (including TLS
      # termination) and the dual-axis credential-mask check had NO CI job
      # anywhere that could run them: `check` runs on ubuntu without
      # KERYX_ALLOW_REAL_SUBPROCESS, and `linux-sandbox` exercises bwrap only.
      # Restricted network is macOS-only in v1.x (bubblewrap cannot express
      # "deny all network except this one loopback socket"), so the allowlist
      # proxy's live behaviour — the egress boundary itself — was unverified in
      # CI on the one platform that implements it.
      #
      # Every gate here is platform/env, never an optional binary, so on a macOS
      # runner with both flags set the correct outcome is ZERO skips. Running it
      # through the zero-skip guard is the point: without it a gate that quietly
      # stopped matching would leave this green having proven nothing.
      - name: Confirm the macOS sandbox launcher is present
        run: test -x /usr/bin/sandbox-exec

      - name: OS-sandbox macOS legs — seatbelt, allowlist proxy, dual-axis (fail on skip)
        env:
          KERYX_ALLOW_REAL_SUBPROCESS: "1"
          KERYX_DUAL_AXIS_LIVE: "1"
        run: |
          bun ./scripts/opentui-tests-no-skips.ts \
            src/harness/process/sandbox/seatbelt.test.ts \
            src/harness/process/sandbox/network-restricted.smoke.test.ts \
            src/harness/process/sandbox/proxy.test.ts \
            src/harness/process/sandbox/proxy-tls.test.ts \
            src/harness/process/sandbox/tls-ca.test.ts \
            src/harness/process/sandbox/network-run.test.ts \
            src/harness/process/sandbox/dual-axis-live.smoke.test.ts \
            src/harness/process/sandbox/dual-axis-report.test.ts \
            src/harness/process/sandbox/mask-resolve.test.ts

      # The gate is `darwin` + `/usr/bin/script`. If the runner image ever drops
      # `script`, the suite would SKIP and this job would go green having proven
      # nothing — so fail here instead, where the reason is legible.
      - name: Confirm a pty allocator is present
        run: test -x /usr/bin/script

      # `bun test` counts a skip as neither pass nor fail, so a gate that
      # silently closed would leave this job green and vacuous. Reuse the same
      # zero-skip guard the OpenTUI matrix uses.
      - name: Launch the real shell on an allocated pty (fail on skip)
        env:
          KERYX_ALLOW_REAL_SUBPROCESS: "1"
        run: bun ./scripts/opentui-tests-no-skips.ts src/commands/shell-pty-launch.smoke.test.ts

  linux-sandbox:
    # Live validation of the LINUX OS-sandbox path (bubblewrap). The `check` job
    # skips every sandbox smoke because they are gated behind
    # KERYX_ALLOW_REAL_SUBPROCESS=1 — without this job the bwrap path is covered
    # only by unit tests of argv construction, never by a real contained spawn.
    name: linux sandbox (bubblewrap) live smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Non-fatal `update` for the reason given at the first `Install ripgrep`
      # step: `bwrap --version` below is what proves the launcher is there.
      - name: Install bubblewrap
        run: |
          sudo apt-get update || echo "apt-get update reported errors; the install below is the gate"
          sudo apt-get install -y bubblewrap

      - name: Confirm the launcher is present
        run: bwrap --version

      # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
      # bwrap requires. Without this the launcher cannot start at all — and a
      # broken launcher looks a lot like "everything was contained".
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # Fail LOUDLY (with bwrap's own stderr) if containment cannot run here,
      # instead of letting the smokes fail with a bare "file was not created".
      # Mirrors buildBwrapArgs' flag set, `--unshare-pid` included: a kernel or
      # runner that cannot create a PID namespace then fails HERE, with bwrap's
      # own stderr, instead of surfacing as an inscrutable assertion inside a
      # smoke test.
      - name: Sanity-check that bwrap can actually contain a process
        run: |
          bwrap --ro-bind / / --dev /dev --proc /proc --tmpfs /tmp \
                --unshare-pid --unshare-ipc --unshare-net --die-with-parent --new-session \
                -- /bin/echo bwrap-can-run

      - name: OS-sandbox live smokes (real subprocesses under bwrap)
        env:
          KERYX_ALLOW_REAL_SUBPROCESS: "1"
        run: |
          bun test \
            src/harness/process/sandbox/sandbox.smoke.test.ts \
            src/harness/process/real-process-adapter.smoke.test.ts \
            src/commands/harness-exec.smoke.test.ts \
            src/commands/harness-exec-restricted.smoke.test.ts

  opentui-native-matrix:
    # O-3 (flow 114). PRD N1 claims prebuilt `@opentui/core` native binaries
    # cover keryx's four target platforms, the install path pulls them, and no
    # Zig toolchain is needed. Only darwin-arm64 had ever been exercised
    # (ADR-0005). This matrix exercises all four as hosted runners.
    #
    # The dependency is optional, dynamically imported and fallback-guarded, so a
    # MISSING binary does not error — `keryx shell` silently degrades to readline
    # and every suite still passes. "No error" is therefore not evidence. Both
    # steps below are POSITIVE: one dlopen's the native library and round-trips a
    # byte through Zig-owned memory; the other fails the job if any OpenTUI test
    # skips (a skip == the binary did not resolve == vacuous coverage).
    #
    # ONGOING COST (AC12): this adds FOUR hosted runners to every future PR and
    # push to main — two Ubuntu (x64 + arm64) and two macOS (arm64 + Intel).
    # The cost is NOT money: this repository is public, and standard hosted
    # runners are free with no minute limit for public repos, macOS included.
    # What it actually costs is (a) ~30s of extra wall-clock per PR — the legs
    # run in parallel and each takes 11-28s — (b) queue time, since the free
    # tier's concurrency ceiling for macOS is lower than for Linux, so two
    # macOS legs can wait when several PRs land at once, and (c) four more
    # places that can go red for reasons unrelated to the change under review,
    # e.g. a runner-image or label change upstream (macos-13 was retired
    # mid-flight while this matrix was being written).
    # These legs are deliberately NOT required status checks — only
    # "typecheck, tests, standard" is — so a red leg informs without blocking.
    # Whoever next edits CI is trading the above for continuous proof of N1's
    # platform claim; drop a leg only by also reopening O-3 in the specification.
    name: opentui native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      # One platform's missing binary must not cancel the others' evidence.
      fail-fast: false
      matrix:
        include:
          # Runner labels verified against GitHub's hosted-runner offering on
          # 2026-07-22 (docs.github.com "GitHub-hosted runners" + actions/
          # runner-images). arm64 Linux is free/unlimited on public repos.
          - target: linux-x64
            runner: ubuntu-latest # ubuntu-24.04, x64 (GA)
          - target: linux-arm64
            runner: ubuntu-24.04-arm # arm64 (GA for public repos)
          - target: darwin-arm64
            runner: macos-latest # macos-15, arm64 (GA)
          # macos-13 (the description's proposed Intel label) RETIRED 2025-12-04.
          # macos-15-intel is the current — and last — hosted x86_64 macOS image
          # (available through Aug 2027 per actions/runner-images#13027/#13045).
          - target: darwin-x64
            runner: macos-15-intel # macos-15, x64/Intel
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No Zig toolchain is installed anywhere in this job — that absence is part
      # of the N1 claim, and the verifier below asserts `zig` is not on PATH.
      - name: Install dependencies (pulls the prebuilt native binary, no toolchain)
        run: bun install

      # AC2 — POSITIVE proof the platform-specific prebuilt binary resolved:
      # imports `@opentui/core-<platform>-<arch>`, dlopen's it via the FFI loader,
      # and round-trips a byte through native memory. Fails LOUDLY (in the spirit
      # of the linux-sandbox job) if the native layer is not really there.
      - name: Assert the @opentui/core native binary resolved (positive check)
        run: bun ./scripts/verify-opentui-native.ts

      # AC3 — run the OpenTUI-dependent suites and FAIL if any test skips. A skip
      # means the optional dependency did not resolve on this runner, so a
      # green-with-skips run would be vacuous evidence of the platform claim.
      - name: Run OpenTUI-dependent tests with zero skips (fail on skip)
        run: bun ./scripts/opentui-tests-no-skips.ts src/tui

  vscode-extension:
    # vscode-extension/ had NO CI coverage at all until this job — a change
    # there could regress silently until someone remembered to run
    # `bun test src` by hand. Its own README states the actual boundary: every
    # piece of decision logic lives in a `*-logic.ts` module with zero `vscode`
    # import and is unit-tested outside any VS Code host, while the thin
    # `vscode`-importing adapters are not — this job proves the former stays
    # green on every push/PR; it does not (and, without a real VS Code/Cursor
    # GUI on a runner, cannot) prove activation inside a real editor host.
    name: vscode-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: vscode-extension
        run: bun install

      - name: Typecheck
        working-directory: vscode-extension
        run: bun run typecheck

      - name: Unit tests (logic layer, no VS Code host required)
        working-directory: vscode-extension
        run: bun run test
