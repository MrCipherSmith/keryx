name: Bug report
description: Report a reproducible keryx problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Include the smallest reproduction and any relevant `.metaproject/data/*/artifacts/latest.*` files when possible.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed, and what did you expect instead?
      placeholder: "keryx health run marks public assets as source files..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Commands and repository state needed to reproduce.
      placeholder: |
        1. keryx init
        2. keryx gdgraph build
        3. keryx health run --changed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: keryx version
      description: Output of `keryx --version`, or the commit SHA if you run from source.
      placeholder: "0.3.46"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - npm (npm install -g @mrciphersmith/keryx)
        - Standalone binary
        - Install script (managed clone in ~/.keryx)
        - Project clone (.metaproject/runtime/keryx)
        - From source (bun ./src/cli.ts)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15 arm64, Ubuntu 24.04 x64"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Model provider and model
      description: Only if the problem involves `keryx shell`, `keryx harness`, or another model command. Write "none" otherwise.
      placeholder: "ollama / llama3.1"
  - type: textarea
    id: doctor
    attributes:
      label: keryx doctor output
      description: Run `keryx doctor` (or `keryx doctor --json`) in the affected project and paste the result. Remove anything private first.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Other environment details
      description: Bun version if not shown by doctor, project framework, CI runner, and anything else relevant.
  - type: textarea
    id: artifacts
    attributes:
      label: Relevant artifacts
      description: Paste short excerpts or attach files if GitHub allows it.
      placeholder: |
        .metaproject/data/health/artifacts/latest.md
        .metaproject/data/testing/artifacts/latest.md
        .metaproject/data/gdgraph/artifacts/summary.md
